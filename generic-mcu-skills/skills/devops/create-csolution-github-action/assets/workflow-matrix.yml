name: __WORKFLOW_NAME__

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [__DEFAULT_BRANCH__]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
__MATRIX_ROWS__

    steps:
      - uses: actions/checkout@v7

      - name: Activate vcpkg environment
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: __VCPKG_CONFIG__
          cache: __CACHE_KEY__

      # The default Arm license setup is for evaluation only.
      - name: Activate Arm tool license
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build ${{ matrix.target_type }}
        working-directory: "__SOLUTION_DIR__"
        run: |
          cbuild "__SOLUTION_FILE__" \
            --active "${{ matrix.target_type }}" \
            --packs

      - name: Run ${{ matrix.target_type }} on FVP simulation
        if: matrix.fvp != ''
        working-directory: "__SOLUTION_DIR__"
        run: |
          set -o pipefail
          "${{ matrix.fvp }}" \
            -f "${{ matrix.fvp_config }}" \
            -a out/*/"${{ matrix.target_type }}"/*/*.hex \
            --simlimit 120 2>&1 | tee fvp.log

      - name: Check FVP output
        if: matrix.fvp != ''
        working-directory: "__SOLUTION_DIR__"
        run: |
          # Replace this stub with confirmed application output checks.
          test -s fvp.log
__FVP_OUTPUT_CHECKS__

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: __ARTIFACT_NAME_PREFIX__-${{ matrix.target_type }}
          path: |
            __SOLUTION_DIR__/out
            __SOLUTION_DIR__/fvp.log
          if-no-files-found: warn
